[project]
name = "lab09-llm-gateway"
version = "0.1.0"
description = "Учебный проект по дисциплине «Игровой ИИ»"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "openai>=1.30",
    "anthropic>=0.28",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "prometheus-client>=0.20",
    "locust>=2.25",
    "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*"]
